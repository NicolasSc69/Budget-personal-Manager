services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: prod
      APP_SECRET: "${APP_SECRET:?Definissez APP_SECRET dans le fichier .env}"
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data_prod.db"
    volumes:
      - budget_data:/var/www/html/var
    restart: unless-stopped

volumes:
  budget_data:
