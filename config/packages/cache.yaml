framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        pools:
            # Results of the balance / sum / report calculations (see App\Service\CalculationCache).
            # Tag-aware so that every entry is dropped at once as soon as any entity is created,
            # updated or deleted (see App\EventListener\CalculationCacheInvalidator).
            cache.calculations:
                adapter: cache.adapter.filesystem
                tags: true
                default_lifetime: 86400

when@test:
    framework:
        cache:
            pools:
                # In memory: the tests roll their database changes back, a persistent cache would
                # keep serving results computed from rows that no longer exist.
                cache.calculations:
                    adapter: cache.adapter.array
                    tags: true
